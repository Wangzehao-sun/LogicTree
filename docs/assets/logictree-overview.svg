<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">LogicTree framework overview</title>
  <desc id="description">A symbolic logic tree is grounded by a language model, converted to task prompts, solved by another model, and validated into a final reasoning dataset.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6472"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 650 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526071; }
      .node { stroke-width: 2; rx: 14; filter: url(#shadow); }
      .arrow { stroke: #5b6472; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="360" rx="22" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">From Symbolic Logic Trees to Instantiated Reasoning Data</text>

  <rect class="node" x="35" y="112" width="170" height="120" fill="#e8f1ff" stroke="#6b93c4"/>
  <text x="120" y="148" text-anchor="middle" class="label">Symbolic Tree</text>
  <text x="120" y="177" text-anchor="middle" class="small">rules · options</text>
  <text x="120" y="201" text-anchor="middle" class="small">reasoning trace</text>

  <path class="arrow" d="M205 172 H250"/>

  <rect class="node" x="255" y="112" width="180" height="120" fill="#fff3cd" stroke="#d5a93f"/>
  <text x="345" y="148" text-anchor="middle" class="label">Stage 1 LLM</text>
  <text x="345" y="177" text-anchor="middle" class="small">semantic grounding</text>
  <text x="345" y="201" text-anchor="middle" class="small">real-world scenario</text>

  <path class="arrow" d="M435 172 H480"/>

  <rect class="node" x="485" y="112" width="190" height="120" fill="#eaf8ef" stroke="#63a878"/>
  <text x="580" y="148" text-anchor="middle" class="label">Grounded Data</text>
  <text x="580" y="177" text-anchor="middle" class="small">entities · context</text>
  <text x="580" y="201" text-anchor="middle" class="small">validated mappings</text>

  <rect class="node" x="725" y="80" width="190" height="82" fill="#f1ecff" stroke="#8b73c7"/>
  <text x="820" y="113" text-anchor="middle" class="label">Choice Prompt</text>
  <text x="820" y="139" text-anchor="middle" class="small">shuffled conclusions</text>

  <rect class="node" x="725" y="192" width="190" height="82" fill="#f1ecff" stroke="#8b73c7"/>
  <text x="820" y="225" text-anchor="middle" class="label">Story Prompt</text>
  <text x="820" y="251" text-anchor="middle" class="small">multiple writing styles</text>

  <path d="M675 172 H700 V121 H720" class="arrow"/>
  <path d="M675 172 H700 V233 H720" class="arrow"/>

  <path class="arrow" d="M915 121 H960 V151 H985"/>
  <path class="arrow" d="M915 233 H960 V193 H985"/>

  <rect class="node" x="990" y="112" width="175" height="120" fill="#ffecef" stroke="#d56b78"/>
  <text x="1077" y="148" text-anchor="middle" class="label">Stage 2 LLM</text>
  <text x="1077" y="177" text-anchor="middle" class="small">reasoning generation</text>
  <text x="1077" y="201" text-anchor="middle" class="small">answer validation</text>

  <path d="M1077 232 V306 H742" class="arrow"/>
  <rect x="465" y="279" width="270" height="54" rx="27" fill="#172033"/>
  <text x="600" y="313" text-anchor="middle" style="font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: white;">Final Reasoning Dataset</text>
</svg>
