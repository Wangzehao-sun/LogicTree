[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logictree"
version = "0.1.0"
description = "A research framework for generating grounded logical-reasoning datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
stats = ["transformers>=4.40,<6"]

[project.scripts]
logictree = "logictree.cli:main"

[project.urls]
Repository = "https://github.com/Wangzehao-sun/LogicTree"
Issues = "https://github.com/Wangzehao-sun/LogicTree/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"logictree.resources" = ["*.json"]
